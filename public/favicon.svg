<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bulbGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FF"/>
      <stop offset="1" stop-color="#0077FE"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0055FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="48" fill="#0B132B" stroke="#00AEEF" stroke-width="2" />
  
  <!-- Surrounding Light Rays -->
  <g fill="url(#bulbGrad)" filter="url(#glow)">
    <!-- Top Center Ray -->
    <ellipse cx="50" cy="12" rx="3.5" ry="6" />
    <!-- Top Left Ray -->
    <ellipse cx="27" cy="20" rx="3.5" ry="6" transform="rotate(-35 27 20)" />
    <!-- Top Right Ray -->
    <ellipse cx="73" cy="20" rx="3.5" ry="6" transform="rotate(35 73 20)" />
    <!-- Far Left Ray -->
    <ellipse cx="16" cy="40" rx="3.5" ry="6" transform="rotate(-65 16 40)" />
    <!-- Far Right Ray -->
    <ellipse cx="84" cy="40" rx="3.5" ry="6" transform="rotate(65 84 40)" />
    <!-- Bottom Left Ray -->
    <ellipse cx="20" cy="62" rx="3.5" ry="5.5" transform="rotate(-110 20 62)" />
    <!-- Bottom Right Ray -->
    <ellipse cx="80" cy="62" rx="3.5" ry="5.5" transform="rotate(110 80 62)" />
  </g>

  <!-- Main Bulb Contour -->
  <path
    d="M 50 24 C 35.5 24 24 35.5 24 50 C 24 59.5 30 67.5 36 73 C 38 75 39 77 39 80 L 61 80 C 61 77 62 75 64 73 C 70 67.5 76 59.5 76 50 C 76 35.5 64.5 24 50 24 Z"
    stroke="url(#bulbGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#0f172a"
  />

  <!-- Internal Filament / Tech Core -->
  <path
    d="M 44 48 L 47 38 L 53 38 L 56 48 L 47 55 L 53 55"
    stroke="#38BDF8"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="50" cy="46" r="3" fill="#FACC15" filter="url(#glow)" />

  <!-- Screw Base Diagonal Lines -->
  <line x1="41" y1="84" x2="59" y2="84" stroke="#00AEEF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="43" y1="89" x2="57" y2="89" stroke="#00AEEF" stroke-width="4" stroke-linecap="round" />
  <line x1="46" y1="94" x2="54" y2="94" stroke="#00AEEF" stroke-width="3.5" stroke-linecap="round" />
</svg>
